<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS-HRZ - En Mantenimiento</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" href="imagenes/1.ico">
    <style>
        :root {
            --neon-blue: #00d4ff;
            --neon-cyan: #00ffff;
            --electric-blue: #0080ff;
            --deep-blue: #001a33;
            --dark-bg: #000814;
            --darker-bg: #000510;
            --card-bg: #001122;
            --glass-bg: rgba(0, 212, 255, 0.05);
            --text-primary: #ffffff;
            --text-secondary: #a0c4ff;
            --neon-gradient: linear-gradient(135deg, #00d4ff 0%, #00ffff 50%, #0080ff 100%);
            --glass-gradient: linear-gradient(135deg, rgba(0, 212, 255, 0.1) 0%, rgba(0, 255, 255, 0.05) 100%);
            --neon-glow: 0 0 20px rgba(0, 212, 255, 0.5);
            --neon-glow-strong: 0 0 40px rgba(0, 212, 255, 0.8);
            --card-shadow: 0 8px 32px rgba(0, 212, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, var(--dark-bg) 0%, var(--darker-bg) 50%, var(--deep-blue) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-primary);
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 30% 20%, rgba(0, 212, 255, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 70% 80%, rgba(0, 255, 255, 0.08) 0%, transparent 50%);
            pointer-events: none;
        }

        .container {
            text-align: center;
            padding: 40px;
            max-width: 700px;
            position: relative;
            z-index: 2;
            background: var(--card-bg);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 30px;
            backdrop-filter: blur(10px);
            box-shadow: var(--card-shadow);
        }

        .logo {
            font-size: 3rem;
            font-weight: bold;
            background: var(--neon-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 2rem;
            text-shadow: var(--neon-glow);
        }

        .icon-container {
            width: 120px;
            height: 120px;
            background: var(--neon-gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            box-shadow: var(--neon-glow-strong);
            animation: pulse 3s ease-in-out infinite;
        }

        .icon-container i {
            font-size: 60px;
            color: var(--dark-bg);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .message {
            font-size: 1.3rem;
            margin-bottom: 2rem;
            line-height: 1.8;
            color: var(--text-secondary);
        }

        .date-container {
            display: inline-flex;
            align-items: center;
            gap: 1rem;
            background: var(--glass-gradient);
            padding: 1.2rem 2.5rem;
            border-radius: 20px;
            border: 2px solid var(--neon-blue);
            margin-top: 1rem;
            box-shadow: var(--neon-glow);
            transition: all 0.3s ease;
        }

        .date-container:hover {
            transform: translateY(-3px);
            box-shadow: var(--neon-glow-strong);
        }

        .date-icon {
            font-size: 2rem;
            color: var(--neon-cyan);
        }

        .date {
            font-size: 2rem;
            font-weight: 600;
            color: var(--neon-blue);
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: var(--neon-glow-strong);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 0 60px rgba(0, 212, 255, 1);
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
                margin: 20px;
            }

            .logo {
                font-size: 2.2rem;
            }

            .icon-container {
                width: 100px;
                height: 100px;
            }

            .icon-container i {
                font-size: 50px;
            }

            h1 {
                font-size: 2rem;
            }

            .message {
                font-size: 1.1rem;
            }

            .date-container {
                padding: 1rem 2rem;
            }

            .date-icon {
                font-size: 1.5rem;
            }

            .date {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .logo {
                font-size: 1.8rem;
            }

            .icon-container {
                width: 80px;
                height: 80px;
            }

            .icon-container i {
                font-size: 40px;
            }

            h1 {
                font-size: 1.6rem;
            }

            .message {
                font-size: 1rem;
            }

            .date-container {
                padding: 0.8rem 1.5rem;
            }

            .date-icon {
                font-size: 1.3rem;
            }

            .date {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">JARVIS-HRZ</div>
        <div class="icon-container">
            <i class="fas fa-tools"></i>
        </div>
        <h1>Sitio en Mantenimiento</h1>
        <div class="message">
            Estamos trabajando en una nueva versión de JARVIS.<br>
            Volvemos pronto con mejoras increíbles.
        </div>
        <div class="date-container">
            <i class="fas fa-calendar-alt date-icon"></i>
            <span class="date">Abril</span>
        </div>
    </div>
</body>
</html>
