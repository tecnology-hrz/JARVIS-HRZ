<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS-HRZ — Próximamente</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="imagenes/1.ico">
    <style>
        :root {
            --neon-blue: #00d4ff;
            --neon-cyan: #00ffff;
            --electric-blue: #0080ff;
            --deep-blue: #001a33;
            --dark: #000814;
            --darker: #000510;
            --card: #001122;
            --border: rgba(0, 212, 255, 0.2);
            --text: #ffffff;
            --text-dim: #a0c4ff;
            --glow: 0 0 20px rgba(0, 212, 255, 0.5);
            --glow-strong: 0 0 40px rgba(0, 212, 255, 0.8);
            --neon-gradient: linear-gradient(135deg, #00d4ff 0%, #00ffff 50%, #0080ff 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--dark) 0%, var(--darker) 50%, var(--deep-blue) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text);
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(0,212,255,0.1) 0%, transparent 50%);
            top: -200px; left: -100px;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: absolute;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(0,255,255,0.08) 0%, transparent 50%);
            bottom: -150px; right: -100px;
            pointer-events: none;
        }

        .card {
            position: relative;
            z-index: 2;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 3.5rem 3rem;
            max-width: 560px;
            width: 100%;
            margin: 1.5rem;
            box-shadow: 0 8px 32px rgba(0, 212, 255, 0.2);
            backdrop-filter: blur(10px);
        }

        .badge {
            display: inline-block;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            color: var(--neon-cyan);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 0.4rem 1rem;
            border-radius: 50px;
            margin-bottom: 2rem;
            box-shadow: var(--glow);
        }

        .logo {
            font-size: 2.6rem;
            font-weight: 800;
            background: var(--neon-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
        }

        .subtitle {
            font-size: 1.05rem;
            color: var(--text-dim);
            line-height: 1.7;
            margin-bottom: 2.5rem;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-bottom: 2.5rem;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            background: rgba(0, 212, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1rem 1.2rem;
            transition: all 0.3s ease;
        }

        .info-item:hover {
            border-color: rgba(0, 212, 255, 0.5);
            box-shadow: var(--glow);
            transform: translateY(-2px);
        }

        .info-item .icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(0, 212, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .info-item .icon i {
            color: var(--neon-cyan);
            font-size: 0.9rem;
        }

        .info-item .text {
            display: flex;
            flex-direction: column;
        }

        .info-item .text .label {
            font-size: 0.68rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 500;
        }

        .info-item .text .value {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--neon-blue);
            margin-top: 2px;
        }

        .divider {
            height: 1px;
            background: var(--border);
            margin-bottom: 2rem;
        }

        .channel-section {
            text-align: center;
        }

        .channel-section p {
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-bottom: 1rem;
        }

        .whatsapp-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            background: #25d366;
            color: #fff;
            text-decoration: none;
            padding: 0.85rem 1.8rem;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(37, 211, 102, 0.2);
        }

        .whatsapp-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(37, 211, 102, 0.35);
            background: #22c55e;
        }

        .whatsapp-btn i {
            font-size: 1.15rem;
        }

        @media (max-width: 580px) {
            .card {
                padding: 2.5rem 1.5rem;
                border-radius: 20px;
            }
            .logo { font-size: 2rem; }
            .subtitle { font-size: 0.95rem; }
            .info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">Próximamente</span>
        <div class="logo">JARVIS-HRZ</div>
        <p class="subtitle">
            La nueva versión de JARVIS está casi lista.<br>
            Prepárate para una experiencia completamente renovada.
        </p>

        <div class="info-grid">
            <div class="info-item">
                <div class="icon"><i class="fas fa-tag"></i></div>
                <div class="text">
                    <span class="label">Preventa</span>
                    <span class="value">27 de Abril</span>
                </div>
            </div>
            <div class="info-item">
                <div class="icon"><i class="fas fa-download"></i></div>
                <div class="text">
                    <span class="label">Descarga oficial</span>
                    <span class="value">1 de Mayo</span>
                </div>
            </div>
        </div>

        <div class="divider"></div>

        <div class="channel-section">
            <p>Más información y novedades en el canal oficial</p>
            <a href="https://whatsapp.com/channel/0029VbBU7dw5a247qZl0KR3U" target="_blank" rel="noopener noreferrer" class="whatsapp-btn">
                <i class="fab fa-whatsapp"></i>
                Canal Oficial de JARVIS
            </a>
        </div>
    </div>
</body>
</html>
